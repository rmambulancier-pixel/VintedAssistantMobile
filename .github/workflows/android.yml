name: Android APK

on:
  push:
    branches: [main, "vinted-assistant-mobile-v0.1"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # GitHub-hosted Ubuntu runners already provide Android SDK command-line tools.
      # Use the runner's installed SDK directly instead of downloading it via an action.
      - name: Check Android SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VintedAssistantMobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
