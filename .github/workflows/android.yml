name: Android APK

on:
  push:
    branches: [main, "vinted-assistant-mobile-v0.1", "dev/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Version de Gradle fixée par le wrapper du dépôt (gradle/wrapper).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Le SDK Android est préinstallé sur les serveurs GitHub, mais sdkmanager
      # n'est pas dans le PATH : on l'appelle par son chemin complet.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK and run unit tests
        run: |
          chmod +x ./gradlew
          # Nouvelles tentatives si un téléchargement (Gradle, dépendances) échoue côté serveur.
          for i in 1 2 3; do ./gradlew --no-daemon assembleDebug testDebugUnitTest && exit 0; echo "Tentative $i échouée, nouvelle tentative dans 60 s"; sleep 60; done; exit 1

      # Le schéma Room doit être versionné dans le dépôt : on l'affiche pour pouvoir le vérifier.
      - name: Show Room schema
        if: always()
        run: find app/schemas -name '*.json' -print -exec cat {} \; || true

      - name: Upload test report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload debug APK
        id: upload_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VintedAssistantMobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 2

      # Secours quand le quota de stockage des artefacts est atteint : l'APK passe par le journal, en base64.
      - name: APK dans le journal (secours)
        if: steps.upload_apk.outcome == 'failure'
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          echo "APK-BEGIN"
          base64 -w 120 app/build/outputs/apk/debug/app-debug.apk
          echo "APK-END"

      - name: Schémas Room (à versionner)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore
          retention-days: 2

  # Tests sur un vrai Android (émulateur) : base Room, migration 1 → 2, opérations du dépôt.
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: chmod +x ./gradlew && (./gradlew --no-daemon connectedDebugAndroidTest || (sleep 60 && ./gradlew --no-daemon connectedDebugAndroidTest))

      - name: Upload instrumented test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 2
