name: Android APK

on:
  push:
    branches: [main, "vinted-assistant-mobile-v0.1", "dev/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Version de Gradle fixée par le wrapper du dépôt (gradle/wrapper).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Le SDK Android est préinstallé sur les serveurs GitHub, mais sdkmanager
      # n'est pas dans le PATH : on l'appelle par son chemin complet.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK and run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VintedAssistantMobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
